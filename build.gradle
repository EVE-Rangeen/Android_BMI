// ============================================================================
// build.gradle（项目级，位于项目根目录）
// ============================================================================
// 这是整个项目的“顶层”构建文件，主要作用是声明“插件版本”。
// 每个子模块（比如 app）里的 build.gradle 再引用这些插件。

plugins {
    // 三个插件在这里统一声明版本，apply false 表示“只声明版本、不立即应用”，
    // 具体哪个模块要用，由该模块自己的 build.gradle 去应用。
    id 'com.android.application' version '7.3.1' apply false
    id 'com.android.library' version '7.3.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.7.20' apply false
}
