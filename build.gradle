// ============================================================================
// build.gradle（项目级，位于项目根目录）
// ============================================================================
// 这是整个项目的“顶层”构建文件，主要作用是声明“插件版本”。
// 每个子模块（比如 app）里的 build.gradle 再引用这些插件。
//
// 注意：本分支（cityu_lab）的插件版本是为了适配学校的
//   Android Studio 2025.2.1 (Otter) Patch 1：
//   - 该 Studio 支持 AGP 4.0 ~ 8.13，这里取最高的 8.13.0
//   - AGP 8.13 要求 Gradle 8.13 以上、JDK 17 以上（Studio 自带 JDK 21）
// main 分支保持旧工具链（AGP 7.3.1 / Kotlin 1.7.20），两者不要互相覆盖。

plugins {
    // 三个插件在这里统一声明版本，apply false 表示“只声明版本、不立即应用”，
    // 具体哪个模块要用，由该模块自己的 build.gradle 去应用。
    id 'com.android.application' version '8.13.0' apply false
    id 'com.android.library' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
}
