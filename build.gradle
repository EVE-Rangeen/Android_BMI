// Top-level build file where you can add configuration options common to all sub-projects/modules.
// Versions below are chosen to match the Android Studio 2025.2.1 (Otter) toolchain:
//   Android Studio 2025.2.1 supports AGP 4.0 - 8.13 and ships with JDK 21.
//   AGP 8.13 requires Gradle 8.13 or newer and JDK 17 or newer.
plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'com.android.library' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
}
