# ============================================================================
# gradle.properties —— Gradle 的全局配置
# ============================================================================
# 这个文件里的配置对整个项目的所有模块生效。
# 考试环境一般不需要改它，保持默认即可。

# 给 Gradle 守护进程（daemon）分配的最大内存，同时指定文件编码为 UTF-8。
# -Xmx2048m 表示最多用 2GB 内存，内存不足时构建会变慢甚至失败。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 下面这行如果取消注释，会启用“并行构建”（多模块时更快）。
# 单模块项目不需要。
# org.gradle.parallel=true

# 使用 AndroidX（新版的 Android 支持库体系）。
# 本项目大量用 androidx.* 的包，必须为 true。
android.useAndroidX=true

# Kotlin 代码风格：official（官方推荐风格）。
kotlin.code.style=official

# 每个库的 R 类只包含自己声明的资源，减小 R 类体积。
android.nonTransitiveRClass=true
